interactions:
- request:
    body: '{"model": "deepseek-v4-flash", "messages": [{"role": "system", "content":
      "You are a product manager. Turn the requirement into a reviewable PRD with
      explicit goals, non-goals and acceptance criteria.\n\n\n            As a genius
      expert, your task is to understand the content and provide\n            the
      parsed objects in json that match the following json_schema:\n\n\n            {\n  \"$defs\":
      {\n    \"AcceptanceCriterion\": {\n      \"additionalProperties\": false,\n      \"description\":
      \"One testable statement of \\\"done\\\" for the PRD.\\n\\nThe QA agent derives
      its test plan from these, so each criterion must be\\nverifiable by a command
      an agent can run itself (HARNESS_SPEC.md\\nsection 5.1). A criterion nobody
      can check is worse than none because it\\ncreates the illusion of a gate.\\n\\nAttributes:\\n    statement:
      The criterion in one sentence, phrased so that pass/fail is\\n        unambiguous.\\n    verification:
      How to check it. Prefer an executable command over prose.\",\n      \"properties\":
      {\n        \"statement\": {\n          \"minLength\": 1,\n          \"title\":
      \"Statement\",\n          \"type\": \"string\"\n        },\n        \"verification\":
      {\n          \"minLength\": 1,\n          \"title\": \"Verification\",\n          \"type\":
      \"string\"\n        }\n      },\n      \"required\": [\n        \"statement\",\n        \"verification\"\n      ],\n      \"title\":
      \"AcceptanceCriterion\",\n      \"type\": \"object\"\n    }\n  },\n  \"additionalProperties\":
      false,\n  \"description\": \"The PRD: the PM agent''s output and the first human
      gate''s input.\\n\\nAttributes:\\n    requirement_id: Back-pointer to the requirement
      this answers, so a\\n        reviewer can diff intent against interpretation.\\n    problem_statement:
      What hurts today, in the requester''s terms.\\n    goals: What success looks
      like. Deliberately separate from\\n        ``non_goals`` so scope creep is visible
      during review.\\n    non_goals: Explicitly out of scope for this run.\\n    acceptance_criteria:
      The testable definition of done.\\n    open_questions: Unresolved points the
      reviewer must settle. Surfacing\\n        these is better than letting the PM
      agent guess silently.\",\n  \"properties\": {\n    \"artifact_id\": {\n      \"format\":
      \"uuid\",\n      \"title\": \"Artifact Id\",\n      \"type\": \"string\"\n    },\n    \"kind\":
      {\n      \"const\": \"prd\",\n      \"default\": \"prd\",\n      \"title\":
      \"Kind\",\n      \"type\": \"string\"\n    },\n    \"created_at\": {\n      \"format\":
      \"date-time\",\n      \"title\": \"Created At\",\n      \"type\": \"string\"\n    },\n    \"schema_version\":
      {\n      \"default\": 1,\n      \"title\": \"Schema Version\",\n      \"type\":
      \"integer\"\n    },\n    \"requirement_id\": {\n      \"format\": \"uuid\",\n      \"title\":
      \"Requirement Id\",\n      \"type\": \"string\"\n    },\n    \"problem_statement\":
      {\n      \"minLength\": 1,\n      \"title\": \"Problem Statement\",\n      \"type\":
      \"string\"\n    },\n    \"goals\": {\n      \"items\": {\n        \"type\":
      \"string\"\n      },\n      \"minItems\": 1,\n      \"title\": \"Goals\",\n      \"type\":
      \"array\"\n    },\n    \"non_goals\": {\n      \"default\": [],\n      \"items\":
      {\n        \"type\": \"string\"\n      },\n      \"title\": \"Non Goals\",\n      \"type\":
      \"array\"\n    },\n    \"acceptance_criteria\": {\n      \"items\": {\n        \"$ref\":
      \"#/$defs/AcceptanceCriterion\"\n      },\n      \"minItems\": 1,\n      \"title\":
      \"Acceptance Criteria\",\n      \"type\": \"array\"\n    },\n    \"open_questions\":
      {\n      \"default\": [],\n      \"items\": {\n        \"type\": \"string\"\n      },\n      \"title\":
      \"Open Questions\",\n      \"type\": \"array\"\n    }\n  },\n  \"required\":
      [\n    \"requirement_id\",\n    \"problem_statement\",\n    \"goals\",\n    \"acceptance_criteria\"\n  ],\n  \"title\":
      \"ProductRequirements\",\n  \"type\": \"object\"\n}\n\n            Make sure
      to return an instance of the JSON, not the schema itself\n"}, {"role": "user",
      "content": "Requirement:\n{\n  \"artifact_id\": \"369469d4-62ba-4bc6-8de6-1f68efff85c0\",\n  \"kind\":
