    body: '{"model": "deepseek-v4-flash", "messages": [{"role": "system", "content":
      "You are a software developer. Implement the task from the design and report
      the change honestly: what changed, where, and any deviations.\n\n\n            As
      a genius expert, your task is to understand the content and provide\n            the
      parsed objects in json that match the following json_schema:\n\n\n            {\n  \"additionalProperties\":
      false,\n  \"description\": \"What the developer agent produced inside the sandbox.\\n\\nThe
      change itself lives in git; this artifact records where to find it and\\nwhat
      the agent believes it did. Keeping the pointer separate from the diff\\nmeans
      the database index stays small while the authoritative content\\nremains versioned
      in the repository (HARNESS_SPEC.md section 6).\\n\\nAttributes:\\n    task_id:
      The task this change implements.\\n    branch: Branch name pushed from the sandbox.\\n    commit_sha:
      Head commit of the branch at handoff time.\\n    files_changed: Paths touched,
      for review triage and blast-radius checks.\\n    summary: The agent''s own account
      of what changed and why.\",\n  \"properties\": {\n    \"artifact_id\": {\n      \"format\":
      \"uuid\",\n      \"title\": \"Artifact Id\",\n      \"type\": \"string\"\n    },\n    \"kind\":
      {\n      \"const\": \"code_change\",\n      \"default\": \"code_change\",\n      \"title\":
      \"Kind\",\n      \"type\": \"string\"\n    },\n    \"created_at\": {\n      \"format\":
      \"date-time\",\n      \"title\": \"Created At\",\n      \"type\": \"string\"\n    },\n    \"schema_version\":
      {\n      \"default\": 1,\n      \"title\": \"Schema Version\",\n      \"type\":
      \"integer\"\n    },\n    \"task_id\": {\n      \"format\": \"uuid\",\n      \"title\":
      \"Task Id\",\n      \"type\": \"string\"\n    },\n    \"branch\": {\n      \"minLength\":
      1,\n      \"title\": \"Branch\",\n      \"type\": \"string\"\n    },\n    \"commit_sha\":
      {\n      \"maxLength\": 40,\n      \"minLength\": 7,\n      \"title\": \"Commit
      Sha\",\n      \"type\": \"string\"\n    },\n    \"files_changed\": {\n      \"default\":
      [],\n      \"items\": {\n        \"type\": \"string\"\n      },\n      \"title\":
      \"Files Changed\",\n      \"type\": \"array\"\n    },\n    \"summary\": {\n      \"minLength\":
      1,\n      \"title\": \"Summary\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\":
      [\n    \"task_id\",\n    \"branch\",\n    \"commit_sha\",\n    \"summary\"\n  ],\n  \"title\":
      \"CodeChange\",\n  \"type\": \"object\"\n}\n\n            Make sure to return
      an instance of the JSON, not the schema itself\n"}, {"role": "user", "content":
      "Requirement:\n{\n  \"artifact_id\": \"7e87ef94-15d2-42a4-8563-a4774aa64261\",\n  \"kind\":
