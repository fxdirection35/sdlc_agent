interactions:
- request:
    body: '{"model": "deepseek-v4-flash", "messages": [{"role": "system", "content":
      "You are a QA engineer. Write a test plan that proves every acceptance criterion.
      Record criteria you cannot test instead of dropping them.\n\n\n            As
      a genius expert, your task is to understand the content and provide\n            the
      parsed objects in json that match the following json_schema:\n\n\n            {\n  \"$defs\":
      {\n    \"TestPlanItem\": {\n      \"additionalProperties\": false,\n      \"description\":
      \"One planned test, traced back to the criterion it proves.\\n\\nAttributes:\\n    criterion:
      The PRD acceptance criterion this test covers. Kept as text\\n        rather
      than an id because a criterion may be reworded during review\\n        and the
      trace must stay readable.\\n    description: What the test does and what it
      asserts.\\n    test_path: Where the test will live in the sandbox repository.\",\n      \"properties\":
      {\n        \"criterion\": {\n          \"minLength\": 1,\n          \"title\":
      \"Criterion\",\n          \"type\": \"string\"\n        },\n        \"description\":
      {\n          \"minLength\": 1,\n          \"title\": \"Description\",\n          \"type\":
      \"string\"\n        },\n        \"test_path\": {\n          \"minLength\": 1,\n          \"title\":
      \"Test Path\",\n          \"type\": \"string\"\n        }\n      },\n      \"required\":
      [\n        \"criterion\",\n        \"description\",\n        \"test_path\"\n      ],\n      \"title\":
      \"TestPlanItem\",\n      \"type\": \"object\"\n    }\n  },\n  \"additionalProperties\":
      false,\n  \"description\": \"What the QA agent intends to verify, produced before
      any test runs.\\n\\nWriting the plan before execution is what makes the criteria
      a real gate\\nrather than a post-hoc rationalization (HARNESS_SPEC.md section
      5.1).\\n\\nAttributes:\\n    prd_id: The PRD whose acceptance criteria drive
      this plan.\\n    code_change_id: The change under test.\\n    items: The planned
      tests.\\n    uncovered_criteria: Acceptance criteria this plan does not test,
      with\\n        the reason. Surfacing the gap beats silently skipping it, because\\n        an
      uncovered criterion is a reviewer decision, not an agent one.\",\n  \"properties\":
      {\n    \"artifact_id\": {\n      \"format\": \"uuid\",\n      \"title\": \"Artifact
      Id\",\n      \"type\": \"string\"\n    },\n    \"kind\": {\n      \"const\":
      \"test_plan\",\n      \"default\": \"test_plan\",\n      \"title\": \"Kind\",\n      \"type\":
      \"string\"\n    },\n    \"created_at\": {\n      \"format\": \"date-time\",\n      \"title\":
      \"Created At\",\n      \"type\": \"string\"\n    },\n    \"schema_version\":
      {\n      \"default\": 1,\n      \"title\": \"Schema Version\",\n      \"type\":
      \"integer\"\n    },\n    \"prd_id\": {\n      \"format\": \"uuid\",\n      \"title\":
      \"Prd Id\",\n      \"type\": \"string\"\n    },\n    \"code_change_id\": {\n      \"format\":
      \"uuid\",\n      \"title\": \"Code Change Id\",\n      \"type\": \"string\"\n    },\n    \"items\":
      {\n      \"items\": {\n        \"$ref\": \"#/$defs/TestPlanItem\"\n      },\n      \"minItems\":
      1,\n      \"title\": \"Items\",\n      \"type\": \"array\"\n    },\n    \"uncovered_criteria\":
      {\n      \"default\": [],\n      \"items\": {\n        \"type\": \"string\"\n      },\n      \"title\":
      \"Uncovered Criteria\",\n      \"type\": \"array\"\n    }\n  },\n  \"required\":
      [\n    \"prd_id\",\n    \"code_change_id\",\n    \"items\"\n  ],\n  \"title\":
      \"TestPlan\",\n  \"type\": \"object\"\n}\n\n            Make sure to return
      an instance of the JSON, not the schema itself\n"}, {"role": "user", "content":
      "Requirement:\n{\n  \"artifact_id\": \"8e63ecaa-a9a8-4b10-8b46-d8ea2c19a33d\",\n  \"kind\":
      \"requirement\",\n  \"created_at\": \"2026-10-14T07:50:11.511546Z\",\n  \"schema_version\":
      1,\n  \"title\": \"Build a test plan for the CSV export. Approved acceptance
      criteria:\",\n  \"description\": \"Build a test plan for the CSV export. Approved
      acceptance criteria:\\n(1) export produces a CSV with one header row and one
      row per result;\\n(2) exporting 50k rows completes without exceeding 512MB RSS;\\n(3)
      rows containing commas and quotes are correctly escaped;\\n(4) an empty result
      set produces a header-only file.\",\n  \"requester\": \"eval-harness\",\n  \"source_repo\":
      \"eval://golden/qa_plan_from_criteria\"\n}\n\nProduce the test_plan now."}],
      "max_tokens": 4096, "response_format": {"type": "json_object"}}'
