      the approved design. The design\\nspecifies a generator-based writer in src/reports/export.py,
      wired to the\\nexisting GET /reports/{id} endpoint. Target: Python 3.12, Django.\",\n  \"requester\":
      \"eval-harness\",\n  \"source_repo\": \"eval://golden/dev_implement_writer\"\n}\n\nProduce
      the code_change now."}], "max_tokens": 4096, "response_format": {"type": "json_object"}}'
