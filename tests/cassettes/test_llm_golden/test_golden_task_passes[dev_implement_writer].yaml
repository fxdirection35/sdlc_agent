    body: '{"model": "deepseek-v4-flash", "messages": [{"role": "system", "content":
      "You are a software developer. Implement the task from the design as complete
      file edits: every file you create or change carries its full final content,
      and nothing else becomes code. The platform commits your edits, pushes the branch
      and fills in the branch name and commit sha - never invent those. Report the
      change honestly in the summary: what changed, where, and any deviations.\n\n\n            As
      a genius expert, your task is to understand the content and provide\n            the
      parsed objects in json that match the following json_schema:\n\n\n            {\n  \"$defs\":
      {\n    \"FileEdit\": {\n      \"additionalProperties\": false,\n      \"description\":
      \"One file-level edit the developer role claims, before anything is written.\\n\\nThe
      deterministic apply step turns these into a git commit; the model only\\nvalidates
      the claim (HARNESS_SPEC.md: the LLM produces content, code\\ncontrols the flow).\\n\\nAttributes:\\n    path:
      Workspace-relative POSIX path. Absolute paths, backslashes and\\n        ``..``
      segments are rejected: an edit that can escape the workspace\\n        is not
      an edit, it is a write anywhere on the machine.\\n    content: The complete
      file content for a ``write`` - the whole file,\\n        not a diff, because
      single-shot structured output cannot be\\n        trusted to re-anchor hunks.
      Must be empty for a ``delete``.\\n    op: ``write`` creates or replaces the
      file; ``delete`` removes it.\",\n      \"properties\": {\n        \"path\":
      {\n          \"minLength\": 1,\n          \"title\": \"Path\",\n          \"type\":
      \"string\"\n        },\n        \"content\": {\n          \"default\": \"\",\n          \"title\":
      \"Content\",\n          \"type\": \"string\"\n        },\n        \"op\": {\n          \"default\":
      \"write\",\n          \"enum\": [\n            \"write\",\n            \"delete\"\n          ],\n          \"title\":
      \"Op\",\n          \"type\": \"string\"\n        }\n      },\n      \"required\":
      [\n        \"path\"\n      ],\n      \"title\": \"FileEdit\",\n      \"type\":
      \"object\"\n    }\n  },\n  \"additionalProperties\": false,\n  \"description\":
      \"What the developer agent produced inside the sandbox.\\n\\nThe change itself
      lives in git; this artifact records where to find it and\\nwhat the agent believes
      it did. Keeping the pointer separate from the diff\\nmeans the database index
      stays small while the authoritative content\\nremains versioned in the repository
      (HARNESS_SPEC.md section 6).\\n\\nAttributes:\\n    task_id: The task this change
      implements.\\n    branch: Branch name of the applied change. Empty until the
      deterministic\\n        apply step commits the edits and fills it in - the developer
      role\\n        cannot know a name it did not cause.\\n    commit_sha: Head commit
      of the branch. Empty until apply, for the same\\n        reason.\\n    files_changed:
      Paths touched, for review triage and blast-radius checks.\\n        The developer''s
      claim pre-apply; the apply step cross-checks it\\n        against what git actually
      recorded.\\n    edits: The developer''s claimed file edits. This is the payload
      the\\n        apply step writes into the workspace - the patch bridge between
      a\\n        structured-output call and a real commit.\\n    summary: The agent''s
      own account of what changed and why.\\n    pr_url: Where the change can be reviewed
      once the deliver step has\\n        pushed the branch and opened a pull request.
      Empty until then.\",\n  \"properties\": {\n    \"artifact_id\": {\n      \"format\":
      \"uuid\",\n      \"title\": \"Artifact Id\",\n      \"type\": \"string\"\n    },\n    \"kind\":
      {\n      \"const\": \"code_change\",\n      \"default\": \"code_change\",\n      \"title\":
      \"Kind\",\n      \"type\": \"string\"\n    },\n    \"created_at\": {\n      \"format\":
      \"date-time\",\n      \"title\": \"Created At\",\n      \"type\": \"string\"\n    },\n    \"schema_version\":
      {\n      \"default\": 1,\n      \"title\": \"Schema Version\",\n      \"type\":
      \"integer\"\n    },\n    \"task_id\": {\n      \"format\": \"uuid\",\n      \"title\":
      \"Task Id\",\n      \"type\": \"string\"\n    },\n    \"branch\": {\n      \"default\":
      \"\",\n      \"title\": \"Branch\",\n      \"type\": \"string\"\n    },\n    \"commit_sha\":
      {\n      \"default\": \"\",\n      \"title\": \"Commit Sha\",\n      \"type\":
      \"string\"\n    },\n    \"files_changed\": {\n      \"default\": [],\n      \"items\":
      {\n        \"type\": \"string\"\n      },\n      \"title\": \"Files Changed\",\n      \"type\":
      \"array\"\n    },\n    \"edits\": {\n      \"default\": [],\n      \"items\":
      {\n        \"$ref\": \"#/$defs/FileEdit\"\n      },\n      \"title\": \"Edits\",\n      \"type\":
      \"array\"\n    },\n    \"summary\": {\n      \"minLength\": 1,\n      \"title\":
      \"Summary\",\n      \"type\": \"string\"\n    },\n    \"pr_url\": {\n      \"default\":
      \"\",\n      \"title\": \"Pr Url\",\n      \"type\": \"string\"\n    }\n  },\n  \"required\":
      [\n    \"task_id\",\n    \"summary\"\n  ],\n  \"title\": \"CodeChange\",\n  \"type\":
      \"object\"\n}\n\n            Make sure to return an instance of the JSON, not
      the schema itself\n"}, {"role": "user", "content": "Requirement:\n{\n  \"artifact_id\":
