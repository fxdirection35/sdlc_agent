# SDLC Agent Platform — configuration example
#
# Copy to config.yaml and edit. This file is committed, so it holds only the
# NAME of the environment variable carrying each key, never a key itself.
# Export the variables in your shell or a .env file (both gitignored):
#
#   export DEEPSEEK_API_KEY=sk-...
#   export ANTHROPIC_API_KEY=sk-ant-...   # only if you route roles to Claude
#
# Roles and providers are validated at load: a role pointing at an undefined
# provider, or a missing role, fails here rather than at the first LLM call.

providers:
  # The default route: connects directly from within China and costs a
  # fraction of Claude. instructor_mode is required (measured against the
  # real API): DeepSeek rejects json_schema's response_format API-wide and
  # its thinking models reject forced tool_choice, so structured output
  # travels as json_object.
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    instructor_mode: json

  # Kept defined for the switch-back path: point roles back here to run on
  # Claude. No key is required while no role references this provider.
  # instructor_mode defaults to json_schema, which is what Anthropic serves.
  anthropic:
    api_key_env: ANTHROPIC_API_KEY

  # For a self-hosted or proxied OpenAI-compatible gateway, give the entry a
  # friendly key and set litellm_prefix to what litellm needs for routing:
  # our-gateway:
  #   api_key_env: GATEWAY_KEY
  #   litellm_prefix: openai
  #   base_url: https://gateway.internal/v1

roles:
  # All roles on deepseek-v4-flash, the measured-working default (a full PRD
  # turn validated end to end at ~$0.003). Split judgment-heavy roles onto
  # deepseek-reasoner or Claude when quality demands it - per-role providers
  # are the point of this file. No `effort` here: reasoning_effort is not a
  # DeepSeek parameter; omit rather than send something unmeasured.
  product_manager:
    provider: deepseek
    model: deepseek-v4-flash

  architect:
    provider: deepseek
    model: deepseek-v4-flash

  developer:
    provider: deepseek
    model: deepseek-v4-flash

  qa:
    provider: deepseek
    model: deepseek-v4-flash

  # `temperature` is omitted everywhere on purpose. Sampling overrides are a
  # per-provider question; set one only for a provider that accepts it.

budget:
  # Ceiling for ONE task across all roles and all QA retries. On breach the
  # run pauses and raises for a human instead of quietly spending on.
  #
  # At DeepSeek prices (~$0.003 per role turn, measured) this ceiling only
  # trips on a genuinely runaway loop - which is the intent: the gate exists
  # for the pathological case, not for routine runs.
  per_task_usd: 5.0
  # Warn while there is still something to do about it, not at the ceiling.
  warn_at_fraction: 0.8

pipeline:
  # How many times a failed test run returns to the developer before a human
  # is pulled in. Must be finite: an unbounded fix-and-retest loop is a budget
  # fire with no exit.
  max_qa_retries: 3
