[project]
name = "sdlc-agent"
version = "0.1.0"
description = "SDLC agent - AI-driven software development lifecycle assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # L1 domain model - every handoff carries a strongly typed artifact
    # (HARNESS_SPEC.md section 2.1).
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    # L2 orchestration - StateGraph plus the Postgres checkpointer that makes
    # interrupt() gates and crash recovery durable.
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    # L4 LLM gateway and structured output. litellm gives one interface over
    # every provider; instructor validates and retries until the schema holds.
    "litellm>=1.105,<2",
    "instructor>=1.17,<2",
    # L7 service layer.
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
# L3 execution sandbox. Pulled in from P2 onward, when agents start touching
# real repositories. Kept out of the core set because it carries a heavy tree
# (fastmcp, tree-sitter, litellm pins, ...). requires-python is already >=3.12
# so nothing else has to change when this gets installed.
sandbox = [
    "openhands-sdk>=1.54,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    # Record and replay LLM calls so the eval set runs offline in CI instead of
    # being slow, expensive and flaky (HARNESS_SPEC.md section 5.2).
    "pytest-recording>=0.14",
    "vcrpy>=8.2",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "ruff>=0.17",
    "mypy>=2.4",
    "bandit>=1.9",
    "pip-audit>=2.10",
    "pre-commit>=4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
# Turn warnings into failures so a deprecation or a mis-collected class
# surfaces immediately instead of accumulating in noisy output.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# Explicit `select` rather than `extend-select` on purpose. Ruff 0.17 widened
# its built-in default set from ~30 rules to 400+, so inheriting the defaults
# would let a routine ruff upgrade introduce dozens of new failures and turn
# the pre-commit gate red for reasons unrelated to our code. Listing the
# families we actually want keeps the gate stable across upgrades.
#
#   E4/E7/E9, F  pycodestyle imports/statements and pyflakes (correctness)
#   B            bugbear: mutable defaults, except-too-broad, late binding
#   I            isort ordering
#   UP           pyupgrade, safe at the py312 floor
#   SIM          flake8-simplify, collapses needlessly branchy code
#   PTH          flake8-use-pathlib, keeps file handling uniform
#   RUF          ruff's own rules, incl. mutable-class-default warnings
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# The domain layer is entirely pydantic models, and without the plugin mypy
# cannot see that assignment to a frozen model is an error, nor check the
# generated __init__ signature against the declared fields. Enabling it is
# what makes the strictness above actually cover the artifacts.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Require every field to be either defaulted or supplied at construction, so a
# model that silently drops a required artifact field fails type checking.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
